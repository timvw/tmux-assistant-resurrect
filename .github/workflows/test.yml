name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    name: lint (shellcheck + ruff + node)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # Pinned: an unpinned linter turns every upstream release into a
          # potential red build on an unrelated day. ruff 0.16 widened its
          # default rule set, which is exactly how that failure arrives.
          # Bump deliberately, with the new findings reviewed in the same PR.
          pip install --quiet ruff==0.16.5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Gate at error+warning severity (info-level findings are not blockers).
      # SC1091: shellcheck cannot follow dynamic source paths — expected.
      - name: shellcheck (scripts + hooks)
        run: shellcheck --severity=warning --exclude=SC1091 scripts/*.sh hooks/*.sh *.tmux

      # Test scripts are gated at the same level; targeted disable comments
      # handle the intentional patterns (bare truncation, unused read vars).
      - name: shellcheck (tests)
        run: shellcheck --severity=warning --exclude=SC1091 test/*.sh

      - name: ruff (Python helpers)
        run: ruff check scripts/py/

      - name: node --check (JS plugin)
        run: node --check hooks/opencode-session-track.js

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash: [bash, bash3.2]
    name: test (bash ${{ matrix.bash == 'bash' && '5' || '3.2' }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: test/Dockerfile
          load: true
          tags: tmux-assistant-resurrect-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: |
          mkdir -p test-results
          docker run --rm \
            -e TEST_BASH=${{ matrix.bash }} \
            -v ${{ github.workspace }}/test-results:/tmp/test-results \
            tmux-assistant-resurrect-test

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results/junit.xml
          comment_mode: off
          check_name: tests (${{ matrix.bash == 'bash' && 'bash 5' || 'bash 3.2' }})

  # The Docker suites above are Linux-only, so every BSD code path -- `stat -f`,
  # the `ps -o etime=` process-start fallback, and the flattened-argv heuristic
  # that runs because /proc/<pid>/cmdline does not exist -- is exercised solely
  # on contributors' machines. Issue #49 was exactly that: a `ps` keyword BSD
  # rejects, invisible to Linux CI. No Docker needed; tmux is installed below
  # for the contract suite, which drives a real Copilot in a pane.
  #
  # macOS also has the only $TMPDIR that genuinely differs between a hook and the
  # tmux server (/var/folders/<hash>/T, one per login session) -- the divergence
  # behind issue #65, which state-dir-unit-tests.sh pins.
  macos:
    runs-on: macos-latest
    name: macos (hermetic + real binary)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The contract suite drives a real Copilot under tmux, so tmux is required.
      # It is not preinstalled on macOS runners.
      - name: Install tmux
        run: brew install tmux

      - name: Install GitHub Copilot CLI
        run: npm install -g "@github/copilot@^1"

      - name: Hermetic suites
        run: |
          bash test/copilot-unit-tests.sh
          bash test/grok-unit-tests.sh
          bash test/target-resolution-unit-tests.sh
          bash test/state-dir-unit-tests.sh
          bash test/save-hardening-unit-tests.sh
          bash test/restore-unit-tests.sh
          bash test/plugin-hardening-unit-tests.sh

      # The only tmux >= 3.7 in CI. Below 3.7 tmux rewrites ':' and '.' in
      # session names to '_', so the Docker suites (tmux 3.4) cannot reach the
      # target-grammar cases from issue #66 at all — they skip with a notice.
      # This is where that behaviour is actually exercised against a real tmux.
      - name: tmux target contract (real tmux)
        run: bash test/tmux-target-contract-test.sh

      # Real binary, no authentication: Copilot writes the session directory and
      # its lock before the auth check, which is what this pins.
      - name: Copilot upstream contract (real binary)
        env:
          COPILOT_AUTO_UPDATE: 'false'
        run: bash test/copilot-contract-test.sh

  # Portability canary. tmux has no native Windows port, so the plugin cannot
  # run here and this is deliberately NOT a support claim -- it only catches
  # Linux-isms creeping into logic that WSL and MSYS2 users depend on.
  # The save/plugin hardening suites intentionally stay in the Linux/macOS jobs:
  # they verify POSIX symlink replacement, owner-only modes and signal status.
  windows:
    runs-on: windows-latest
    name: windows (portability canary)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Hermetic suites
        run: |
          bash test/copilot-unit-tests.sh
          bash test/grok-unit-tests.sh
          bash test/target-resolution-unit-tests.sh
          bash test/state-dir-unit-tests.sh
          bash test/restore-unit-tests.sh

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: test/Dockerfile
          load: true
          tags: tmux-assistant-resurrect-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare benchmark baseline
        run: |
          git fetch origin main --depth=1
          git worktree add /tmp/benchmark-base origin/main

      - name: Run benchmark matrix
        run: |
          mkdir -p test-results
          bash test/bench-matrix.sh \
            --head-repo "${GITHUB_WORKSPACE}" \
            --base-repo /tmp/benchmark-base \
            --runs 5 \
            --output-csv test-results/benchmark.csv \
            --output-md test-results/benchmark.md
          cat test-results/benchmark.md >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          if-no-files-found: warn
          path: |
            test-results/benchmark.csv
            test-results/benchmark.md
